name: Sovereign Security Harness

# Drop-in across every M2M repository. Runs OUTWARD from inside the repo using the
# built-in GITHUB_TOKEN — no external connector or PAT required for the core checks.
# FL/II: Claude authored; Kevin authenticates by committing + enabling Actions.

on:
  schedule:
    - cron: "0 7 * * *"        # nightly 07:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write         # allow SARIF upload to code scanning

concurrency:
  group: sovereign-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node audit (if package.json present)
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "::group::npm audit"
            npm audit --audit-level=high || echo "::warning::npm audit found high/critical advisories"
            echo "::endgroup::"
          else
            echo "No package.json — skipping node audit."
          fi
      - name: Python audit (if requirements present)
        shell: bash
        run: |
          if ls requirements*.txt >/dev/null 2>&1; then
            pip install pip-audit >/dev/null 2>&1 || true
            pip-audit -r $(ls requirements*.txt | head -1) || echo "::warning::pip-audit found advisories"
          else
            echo "No requirements.txt — skipping python audit."
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS (verified secrets only)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  supabase-advisor-check:
    runs-on: ubuntu-latest
    # Soft job: runs only where the repo owns Supabase infra and provides secrets.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Advisor check (optional)
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase secrets not set for this repo — skipping advisor check."
            exit 0
          fi
          echo "Querying Supabase security advisors for $SUPABASE_PROJECT_REF"
          code=$(curl -s -o advisors.json -w "%{http_code}" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/advisors/security")
          if [ "$code" != "200" ]; then echo "::warning::advisor API returned $code"; exit 0; fi
          count=$(grep -o '"name"' advisors.json | wc -l || echo 0)
          echo "Security advisor findings: $count"
          [ "$count" = "0" ] || echo "::warning::$count Supabase security advisor findings"

  summary:
    runs-on: ubuntu-latest
    needs: [dependency-audit, secret-scan]
    if: always()
    steps:
      - name: Write summary
        shell: bash
        run: |
          {
            echo "## Sovereign Security Harness"
            echo "- Repo: ${{ github.repository }}"
            echo "- Ref: ${{ github.ref_name }}"
            echo "- Dependency audit: ${{ needs.dependency-audit.result }}"
            echo "- Secret scan: ${{ needs.secret-scan.result }}"
            echo ""
            echo "_Powered by AXIOM | M2M~Inc. Sovereign Intelligence Stack_"
          } >> "$GITHUB_STEP_SUMMARY"
